# Full-label conditional diffusion: UNet condition is [Young, Male, No_Beard, Bald].
# Label targets for counterfactual inference are produced by full_label_scm_celeba.
seed: 42
device: cuda
output_dir: /scratch/gilbreth/yu1331/ckpts/celeba/cf_diffusion
checkpoint_subdir: full_label
data_root: /scratch/gilbreth/yu1331/datasets/celebA

celeba_attr_cols:
  - Young
  - Male
  - No_Beard
  - Bald

train_split: train
batch_size: 16
num_workers: 4

use_vae_condition: false
vae_checkpoint: ""
vae_config: configs/vae_celeba.yaml

parent_keys: [Young, Male, No_Beard, Bald]

in_channels: 3
image_size: 64
unet_arch: iddpm
iddpm_model_channels: 128
iddpm_num_res_blocks: 2
iddpm_attention_resolutions: "16,8"
iddpm_dropout: 0.0

timesteps: 1000
beta_start: 0.0001
beta_end: 0.02
ddim_eta: 0.0
epochs: 100
lr: 0.0001
