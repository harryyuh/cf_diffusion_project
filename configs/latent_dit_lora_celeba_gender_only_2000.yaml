# SD3 / MMDiT latent LoRA fine-tune on CelebA with gender-only captions.
# Longer checkpoint sweep: same gender-only condition, save eval checkpoints.
seed: 42
device: cuda
output_dir: /scratch/gilbreth/yu1331/ckpts/celeba/latent_finetune
run_name: sd3_gender_lora_celeba_2000

data_root: /scratch/gilbreth/yu1331/datasets/celebA
train_split: train
image_size: 512
batch_size: 1
num_workers: 4

model_family: sd3
pretrained_model_name_or_path: stabilityai/stable-diffusion-3-medium-diffusers
variant: fp16
mixed_precision: bf16
max_sequence_length: 256

parent_keys: [Male]
gender_key: Male
celeba_attr_cols:
  - Male
caption_prefix: a portrait photo of a
negative_prompt: blurry, low resolution, jpeg artifacts, distorted face

lora_rank: 16
lora_alpha: 16
lora_target_modules: [to_q, to_k, to_v, to_out.0]
gradient_checkpointing: true
gradient_accumulation_steps: 4
max_train_steps: 2000
num_train_timesteps: 1000
lr: 0.0001
lr_scheduler: cosine
lr_warmup_steps: 500
weight_decay: 0.01
max_grad_norm: 1.0
adam_betas: [0.9, 0.999]
log_every: 25
save_every: 500
