seed: 42
device: cuda
output_dir: /scratch/gilbreth/yu1331/ckpts/celeba/token_lora
run_name: minisd_ca_pipeline_four_label_token_lora_ctc_balanced

data_root: /scratch/gilbreth/yu1331/datasets/celebA
train_split: train
image_size: 256
center_crop_size: 150
batch_size: 4
num_workers: 4

pretrained_model_name_or_path: lambdalabs/miniSD-diffusers
mixed_precision: bf16
natural_prompt: a human face, realistic portrait photo

celeba_attr_cols:
  - Young
  - Male
  - No_Beard
  - Bald
balanced_attr_cols:
  - No_Beard
  - Bald
balanced_sampler_power: 1.0

token_init_std: 0.02
max_token_norm: 0.0
gradient_accumulation_steps: 4
max_train_steps: 5000
mapper_lr: 0.001
lora_lr: 0.00005
lora_rank: 16
lora_alpha: 16
lora_target_modules: [to_q, to_k, to_v, to_out.0]

# CA-style PromptCL/CTC over learned causal tokens. CA uses 0.0005 in its
# prompt contrastive loss; keep the same small scale first.
lambda_ctc: 0.0005
ctc_temperature: 0.2
ctc_mode: attr_value

lr_scheduler: cosine
lr_warmup_steps: 100
weight_decay: 0.0
max_grad_norm: 1.0
adam_betas: [0.9, 0.999]
log_every: 25
save_every: 500
