seed: 42
device: cuda
output_dir: /work/nvme/bhje/hyu29/ckpts/celeba/pai_lora
run_name: pai_200k_bs2
data_root: /work/nvme/bhje/hyu29/datasets/celebA
train_split: train
image_size: 256
center_crop_size: 150
batch_size: 2
num_workers: 4
pretrained_model_name_or_path: lambdalabs/miniSD-diffusers
model_family: sd
mixed_precision: bf16
celeba_attr_cols: [Young, Male, No_Beard, Bald]
