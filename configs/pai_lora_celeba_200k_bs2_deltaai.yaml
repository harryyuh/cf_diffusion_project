gradient_accumulation_steps: 1
max_train_steps: 200000
lr_scheduler: cosine
lr_warmup_steps: 100
weight_decay: 0.0
max_grad_norm: 1.0
adam_betas: [0.9, 0.999]
log_every: 100
save_every: 10000
lambda_ctc: 0.0
