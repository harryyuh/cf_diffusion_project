# Latent diffusion fine-tuning route for high-quality CelebA portraits.
# This is separate from configs/diffusion_celeba_parent_only.yaml, which trains
# the repo's pixel-space causal counterfactual model from scratch.
seed: 42
device: cuda
output_dir: /scratch/gilbreth/yu1331/ckpts/celeba/latent_finetune
run_name: sdxl_lora_celeba_a30_trial

data_root: /scratch/gilbreth/yu1331/datasets/celebA
train_split: train
image_size: 512
batch_size: 1
num_workers: 4

# SDXL is a strong, practical default for CelebA LoRA fine-tuning. Set this to a
# local checkpoint path if the cluster has no Hugging Face network/cache access.
model_family: sdxl
pretrained_model_name_or_path: stabilityai/stable-diffusion-xl-base-1.0
variant: fp16
mixed_precision: bf16

celeba_attr_cols:
  - Male
  - Young
  - Smiling
  - Attractive
  - Heavy_Makeup
  - Wearing_Lipstick
  - Mouth_Slightly_Open
  - Eyeglasses
  - Black_Hair
  - Blond_Hair
  - Brown_Hair
  - Gray_Hair
  - Bangs
  - Wavy_Hair
  - Straight_Hair
  - No_Beard
  - Mustache
  - Goatee

caption_prefix: a high quality portrait photo
caption_suffix: sharp focus, realistic skin texture, studio lighting
caption_include_negative_attrs: false
caption_max_attrs: 8

lora_rank: 16
lora_alpha: 16
lora_target_modules: [to_q, to_k, to_v, to_out.0]
gradient_checkpointing: true
gradient_accumulation_steps: 4
max_train_steps: 500
lr: 0.0001
lr_scheduler: cosine
lr_warmup_steps: 500
weight_decay: 0.01
max_grad_norm: 1.0
adam_betas: [0.9, 0.999]
log_every: 25
save_every: 250
num_inference_steps_for_validation: 30
