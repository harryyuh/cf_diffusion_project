seed: 42
device: cuda
output_dir: /scratch/gilbreth/yu1331/ckpts/celeba/latent_finetune
run_name: minisd_ca_pipeline_full_label_prompt_lora

data_root: /scratch/gilbreth/yu1331/datasets/celebA
train_split: train
image_size: 256
center_crop_size: 150
batch_size: 4
num_workers: 4

model_family: sd
pretrained_model_name_or_path: lambdalabs/miniSD-diffusers
mixed_precision: bf16

celeba_attr_cols:
  - Young
  - Male
  - No_Beard
  - Bald

use_label_conditioning: false
prompt_from_full_labels: true
prompt_label_cols:
  - Young
  - Male
  - No_Beard
  - Bald
full_label_prompt_prefix: a human face
full_label_prompt_suffix: realistic portrait photo

lora_rank: 16
lora_alpha: 16
lora_target_modules: [to_q, to_k, to_v, to_out.0]
gradient_checkpointing: true
gradient_accumulation_steps: 4
max_train_steps: 5000
lr: 0.00005
lr_scheduler: cosine
lr_warmup_steps: 250
weight_decay: 0.01
max_grad_norm: 1.0
adam_betas: [0.9, 0.999]
log_every: 25
save_every: 500
