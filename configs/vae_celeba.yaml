seed: 42
device: cuda
output_dir: /scratch/gilbreth/yu1331/ckpts/celeba/cf_vae
data_root: /scratch/gilbreth/yu1331/datasets/celebA
celeba_attr_cols:
  - Male
  - Young
  - Smiling
  - Attractive
  - Heavy_Makeup
  - Wearing_Lipstick
  - Mouth_Slightly_Open
  - Eyeglasses
  - Black_Hair
  - Blond_Hair
train_split: train
val_split: val
batch_size: 64
num_workers: 4
epochs: 100
lr: 0.001
latent_dim: 32
beta_vae: 1.0
recon_loss: mse
in_channels: 3
image_size: 64
hidden_dims: [32, 64, 128]
# Match existing vae_best.pt (parent head + adversary were trained with 1-D parent prediction).
parent_keys: [Male]
n_parent_dims: 4
parent_pred_hidden: 32
parent_pred_dim: 1
use_adversary: true
adv_hidden: 32
adv_weight: 0.2
hsic_weight: 0.0
