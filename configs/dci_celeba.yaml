# DCI on CelebA test split. Factor columns should match attributes present in celeba_attr_cols
# (and columns the VAE was trained with).
seed: 42
device: cuda
data_root: /scratch/gilbreth/yu1331/datasets/celebA
split: test

celeba_attr_cols:
  - Male
  - Young
  - Smiling
  - Attractive
  - Heavy_Makeup
  - Wearing_Lipstick
  - Mouth_Slightly_Open
  - Eyeglasses
  - Black_Hair
  - Blond_Hair

# Set true only if VAE YAML also used use_all_celeba_attrs: true (all 40 attributes).
# use_all_celeba_attrs: true

vae_checkpoint: /scratch/gilbreth/yu1331/ckpts/celeba/cf_vae/checkpoints/vae_best.pt
vae_config: configs/vae_celeba.yaml

use_encoder_mu: true

informativeness_z_rest_focus_cols:
  - Male
  - Young

batch_size: 128
num_workers: 4
image_size: 64

output_json: /scratch/gilbreth/yu1331/evaluations/celeba/dci_test.json
