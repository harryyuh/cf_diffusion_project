seed: 42
device: cuda
output_dir: /scratch/gilbreth/yu1331/ckpts/celeba/token_only
run_name: minisd_ca_pipeline_four_label_token_only_balanced

data_root: /scratch/gilbreth/yu1331/datasets/celebA
train_split: train
image_size: 256
center_crop_size: 150
batch_size: 4
num_workers: 4

pretrained_model_name_or_path: lambdalabs/miniSD-diffusers
mixed_precision: bf16
natural_prompt: a human face, realistic portrait photo

celeba_attr_cols:
  - Young
  - Male
  - No_Beard
  - Bald
balanced_attr_cols:
  - No_Beard
  - Bald
balanced_sampler_power: 1.0

token_init_std: 0.02
max_token_norm: 0.0
gradient_accumulation_steps: 4
max_train_steps: 5000
lr: 0.001
lr_scheduler: cosine
lr_warmup_steps: 100
weight_decay: 0.0
max_grad_norm: 1.0
adam_betas: [0.9, 0.999]
log_every: 25
save_every: 500
